[package]
name = "propamm-bot"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Feed collector, recorder, fair-value engine and price-update bot for PropAMM"

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "ws", "json"] }
base64 = "0.22.1"
clap = { version = "4.6.7", features = ["derive"] }
fastrand = "2.5.0"
futures-util = "0.3.34"
propamm-client = { version = "0.1.0", path = "../client" }
propamm-pricing = { version = "0.1.0", path = "../pricing" }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
solana-hash = { version = "4.6.0", features = ["copy"] }
solana-instruction = "3.1.0"
solana-keypair = "3.1.2"
solana-message = "4.6.0"
solana-pubkey = { version = "4.0.0", features = ["serde"] }
solana-signature = "3.5.2"
solana-signer = "3.0.1"
solana-transaction = { version = "4.3.0", features = ["blake3"] }
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "time", "signal", "sync", "net"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tower-http = { version = "0.6.11", default-features = false, features = ["cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zstd = { version = "0.14.0", default-features = false }

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
