[package]
name = "propamm-wasm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "WASM bindings of the PropAMM pricing and account decoding for the demo web app"

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
propamm-client = { version = "0.1.0", path = "../client" }
propamm-pricing = { version = "0.1.0", path = "../pricing" }
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
solana-pubkey = "4.0.0"
# Must match the installed `wasm-bindgen` CLI exactly (docs/toolchain.md).
wasm-bindgen = "=0.2.129"

[dev-dependencies]
bytemuck = "1.25.2"
serde_json = "1.0.151"
