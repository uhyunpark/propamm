[package]
name = "propamm-pinocchio"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "PropAMM on-chain program (Pinocchio port of programs/propamm)"

[lib]
crate-type = ["cdylib", "lib"]

[lints]
workspace = true

[dependencies]
bytemuck = { version = "1.25.2", default-features = false }
pinocchio = { version = "0.11.2", default-features = false, features = ["cpi"] }
pinocchio-system = "0.6.1"
pinocchio-token = "0.7.0"
propamm-pricing = { path = "../../crates/pricing" }
# `decode` for `declare_id!`.
solana-address = { version = "2.7.0", features = ["decode"] }

# Off-chain builds (clippy, host tests) need the curve check behind `find_program_address`.
[target.'cfg(not(target_os = "solana"))'.dependencies]
solana-address = { version = "2.7.0", features = ["decode", "curve25519"] }
